<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asset Stickers — IT Asset System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #fff; color: #17120E; }
  .no-print { padding: 16px; background: #881337; color: white; display: flex; align-items: center; gap: 12px; }
  .no-print button { padding: 8px 20px; background: white; color: #881337; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; }
  .no-print button:hover { opacity: 0.9; }
  .stickers-grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 20px; }
  .sticker-card {
    border: 2px solid #17120E;
    border-radius: 8px;
    padding: 10px;
    width: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
    page-break-inside: avoid;
    break-inside: avoid;
    position: relative;
  }
  .sticker-card::before {
    content: '';
    position: absolute;
    top: 0; left: 4px;
    width: 100px; height: 3px;
    background: #EAB308;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 100%, 0 100%);
  }
  .sticker-card img { width: 110px; height: 110px; display: block; margin-top: 4px; }
  .sticker-tag { font-weight: 800; font-size: 14px; letter-spacing: 0.04em; color: #881337; }
  .sticker-sn { font-size: 10px; color: #6B6258; font-family: 'JetBrains Mono', monospace; }
  .sticker-type { font-size: 11px; color: #17120E; }
  .sticker-model { font-size: 11px; color: #17120E; }
  .sticker-loc { font-size: 10px; color: #6B6258; border-top: 1px solid #DED5CC; padding-top: 4px; width: 100%; }
  .sticker-logo { font-size: 9px; color: #9C9388; margin-top: 2px; }
  @media print {
    .no-print { display: none !important; }
    body { margin: 0; }
    .stickers-grid { padding: 8px; gap: 8px; }
    .sticker-card { border: 1.5px solid #000; }
    .sticker-card::before { display: none; }
  }
</style>
</head>
<body>
<div class="no-print">
  <span style="font-weight:700">Asset QR Stickers ({{ stickers|length }})</span>
  <button onclick="window.print()">Print Stickers</button>
  <a href="javascript:history.back()" style="color:rgba(255,255,255,0.8);text-decoration:none;margin-left:auto;font-size:13px">Back</a>
</div>
<div class="stickers-grid">
  {% for s in stickers %}
  <div class="sticker-card">
    <img src="data:image/png;base64,{{ s.qr }}" alt="QR">
    <div class="sticker-tag">{{ s.asset.asset_tag }}</div>
    <div class="sticker-type">{{ s.asset.device_type }}</div>
    <div class="sticker-model">{{ s.asset.model_name }}</div>
    <div class="sticker-sn">S/N: {{ s.asset.serial_number }}</div>
    {% if s.asset.location %}
    <div class="sticker-loc">{{ s.asset.location }}</div>
    {% endif %}
    <div class="sticker-logo">IT Asset System</div>
  </div>
  {% endfor %}
</div>
</body>
</html>
