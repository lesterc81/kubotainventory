{% extends "base.html" %}
{% block title %}{{ code }} — IT Asset System{% endblock %}
{% block content %}
<div class="empty-state" style="min-height:60vh">
  <span class="material-icons-round" style="font-size:72px;opacity:0.2">
    {% if code == 404 %}search_off{% elif code == 403 %}lock{% else %}error{% endif %}
  </span>
  <h3>{{ code }} — {{ message }}</h3>
  <p class="mt-1"><a href="{{ url_for('dashboard.index') }}">Go to Dashboard</a></p>
</div>
{% endblock %}
